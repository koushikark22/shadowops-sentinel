# Search-time JSON extraction for ShadowOps HEC events.
# Do not combine KV_MODE=json with INDEXED_EXTRACTIONS=json for the same sourcetype.
# Splunk documents that using both for a sourcetype causes duplicate/incorrect extraction behavior.

[shadowops:auth]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[shadowops:proxy]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[shadowops:jira]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[shadowops:agent]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[shadowops:splunk_audit]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[shadowops:mcp_access]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0

[shadowops:detection]
KV_MODE = json
SHOULD_LINEMERGE = false
TRUNCATE = 0
