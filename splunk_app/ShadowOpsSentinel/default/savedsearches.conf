[ShadowOps - Full Attack Chain Correlation]
description = Correlates prompt injection, rogue agent activity, sensitive Splunk search, and external egress.
search = index=shadowops earliest=-24h | eval has_prompt_injection=if(prompt_injection="true" OR prompt_injection=1 OR like(lower(ticket_body),"%ignore previous instructions%"),1,0) | eval has_sensitive_search=if(sourcetype="shadowops:splunk_audit" AND (sensitive_index="true" OR sensitive_index=1 OR like(search,"%customer_payments%") OR like(search,"%prod_secrets%")),1,0) | eval has_external_egress=if(sourcetype="shadowops:proxy" AND NOT like(dest_domain,"%.corp.local") AND bytes_out>10000,1,0) | eval has_token=if(isnotnull(token_id),1,0) | eval unregistered=if(registered_agent="false" OR registered_agent=0 OR access_path="direct_token",1,0) | stats earliest(_time) as first_seen latest(_time) as last_seen values(ticket_id) as ticket_id values(agent_id) as agent_id values(user) as users values(host) as hosts values(search) as searches values(dest_domain) as destinations sum(has_prompt_injection) as prompt_injection_events sum(has_sensitive_search) as sensitive_search_events sum(has_external_egress) as external_egress_events sum(has_token) as token_events max(unregistered) as unregistered_or_direct values(risk_signal) as risk_signals by correlation_id | where isnotnull(correlation_id) | eval risk_score=0 | eval risk_score=risk_score + if(unregistered_or_direct=1,20,0) | eval risk_score=risk_score + if(sensitive_search_events>0,25,0) | eval risk_score=risk_score + if(prompt_injection_events>0,20,0) | eval risk_score=risk_score + if(external_egress_events>0,20,0) | eval risk_score=risk_score + if(token_events>0,10,0) | eval risk_score=risk_score + if(sensitive_search_events>=2,15,0) | eval risk_score=if(risk_score>100,100,risk_score) | eval severity=case(risk_score>=80,"critical",risk_score>=60,"high",risk_score>=31,"medium",true(),"low") | table severity risk_score correlation_id first_seen last_seen agent_id users hosts ticket_id destinations prompt_injection_events sensitive_search_events external_egress_events searches risk_signals
cron_schedule = */5 * * * *
disabled = 0
is_scheduled = 1
alert_type = always

[ShadowOps - Prompt Injection Tickets]
description = Finds suspicious prompt-injection language in ticket content.
search = index=shadowops sourcetype="shadowops:jira" | eval lower_body=lower(ticket_body) | eval prompt_injection_detected=if(prompt_injection="true" OR like(lower_body,"%ignore previous instructions%") OR like(lower_body,"%send summary to%") OR like(lower_body,"%webhook%"),1,0) | where prompt_injection_detected=1 | table _time ticket_id project user host title ticket_body correlation_id risk_signal
cron_schedule = */5 * * * *
disabled = 0
is_scheduled = 1
